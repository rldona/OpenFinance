<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Repository cover / GitHub social preview (1280x640). Rendered into cover.png by docs/assets/make-cover.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(15, 118, 110, .55), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(13, 148, 136, .26), transparent 60%),
      linear-gradient(135deg, #061210 0%, #0c2a26 60%, #08201d 100%);
  }
  .brand { position: absolute; left: 76px; top: 92px; width: 540px; }
  .icon { width: 132px; height: 132px; display: block; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45)); }
  h1 { font-size: 84px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #c9e8e3; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #e6f4f1; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
    background: #f4f6f8;
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #e6ebf0; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="icon" viewBox="0 0 1024 1024" role="img" aria-label="OpenFinance icon">
      <rect width="1024" height="1024" rx="224" fill="#0f766e"/>
      <rect x="238" y="592" width="132" height="192" rx="28" fill="#fff"/>
      <rect x="446" y="464" width="132" height="320" rx="28" fill="#fff"/>
      <rect x="654" y="316" width="132" height="468" rx="28" fill="#fff"/>

    <h1>OpenFinance</h1>

      <span class="chip">Open source</span><span class="chip">Self-hosted</span><span class="chip">No cloud</span><span class="chip">CSV import</span>
