name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: openfinance
          POSTGRES_PASSWORD: openfinance
          POSTGRES_DB: openfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfinance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://openfinance:openfinance@localhost:5432/openfinance
      TEST_DATABASE_URL: postgresql+psycopg://openfinance:openfinance@localhost:5432/openfinance
      OPENFINANCE_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy openfinance
      - run: uv run lint-imports
      - run: uv run pytest --cov=openfinance --cov-report=term-missing
      - name: Migraciones
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Contrato OpenAPI al día
        run: |
          uv run python -m openfinance.api.export_openapi > ../../apps/web/openapi.json
          git diff --exit-code -- ../../apps/web/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: El lock solo usa el registro público de npm
        run: |
          if grep -nE '"resolved": "' package-lock.json | grep -vE '"resolved": "https://registry\.npmjs\.org/'; then
            echo "::error file=apps/web/package-lock.json::package-lock.json contiene URLs fuera de registry.npmjs.org (¿registro privado o jfrog?). Regenera el lock contra el registro público."
            exit 1
          fi
      - run: npm ci
      - name: Tipos del cliente generados desde OpenAPI
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  # OF-902: dependencias e imágenes sin vulnerabilidades conocidas graves.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: pip-audit (dependencias de la API en producción)
        working-directory: services/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: npm audit (dependencias de la web que se distribuyen)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Construir las imágenes
        run: |
          docker build -f deploy/docker/api.Dockerfile -t openfinance-api:ci .
          docker build -f deploy/docker/web.Dockerfile -t openfinance-web:ci .
      - name: Trivy del repositorio (dependencias, configuración y secretos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: Extractos
      - name: Trivy (imagen de la API)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openfinance-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (imagen de la web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openfinance-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Las pruebas de los scripts de despliegue (copias y restauración), sin Docker.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: deploy/scripts/test/backup.sh

  # OF-504: las dependencias que se distribuyen tienen licencias compatibles con AGPL-3.0.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: deploy/scripts/licenses.sh --check

  # OF-501/OF-502: la instalación con Docker Compose en sus dos modos, de extremo a extremo.
  compose-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, https]
    env:
      E2E_EMAIL: raul@demo.openfinance
      E2E_PASSWORD: demo-openfinance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shellcheck de los scripts
        run: shellcheck deploy/scripts/*.sh deploy/scripts/ci/*.sh deploy/scripts/test/*.sh

      - name: Configuración (.env)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "OPENFINANCE_ENVIRONMENT=production"
            if [ "${{ matrix.mode }}" = "direct" ]; then
              echo "OPENFINANCE_SESSION_COOKIE_SECURE=false"
            else
              echo "COMPOSE_FILE=compose.yaml:compose.https.yaml"
              echo "OPENFINANCE_DOMAIN=localhost"
            fi
          } > .env
          if [ "${{ matrix.mode }}" = "direct" ]; then
            echo "BASE_URL=http://127.0.0.1:8080" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=https://localhost" >> "$GITHUB_ENV"
            echo "INSECURE=1" >> "$GITHUB_ENV"
          fi

      - name: Arrancar
        run: |
          docker compose version
          docker compose config --quiet
          docker compose up --build -d --wait

      - name: Puertos publicados
        run: deploy/scripts/ci/ports.sh ${{ matrix.mode }}

      - name: Datos de demostración
        run: docker compose exec -T api openfinance demo --force

      - name: Cookie Secure detrás de Caddy
        if: matrix.mode == 'https'
        run: |
          jq -n --arg e "$E2E_EMAIL" --arg p "$E2E_PASSWORD" '{email: $e, password: $p}' \
            | curl -fsSk -o /dev/null -D headers.txt \
              -H 'X-Requested-With: OpenFinance' -H 'Content-Type: application/json' \
              --data-binary @- "$BASE_URL/api/v1/auth/login"
          grep -i '^set-cookie: of_session=' headers.txt | grep -qi '; *secure'
          rm headers.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.mode == 'direct'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # OF-503. Antes de guardar los saldos: el flujo Importar añade movimientos a la cuenta
      # conjunta, y la copia que se restaura después ya los incluye. Inicia sesión una sola vez
      # (proyecto setup) para no chocar con el límite de nginx en /api/v1/auth/login.
      - name: Playwright (móvil y escritorio)
        if: matrix.mode == 'direct'
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run e2e

      - name: Saldos y exportación (antes)
        run: deploy/scripts/ci/balances.sh "$BASE_URL" before.json cookies-before.txt

      - name: Cabeceras, caché y gzip (OF-903)
        run: deploy/scripts/ci/headers.sh "$BASE_URL"

      - name: IP falsificada en X-Forwarded-For
        run: deploy/scripts/ci/forged-ip.sh "$BASE_URL"

      - name: Copia, borrado y restauración (OF-501)
        if: matrix.mode == 'direct'
        run: |
          # Copia cifrada con age (OF-901): la clave privada no se queda en la carpeta de copias.
          sudo apt-get install -y --no-install-recommends age
          age-keygen -o "$RUNNER_TEMP/age-key.txt" 2> "$RUNNER_TEMP/age-pub.txt"
          export OPENFINANCE_BACKUP_RECIPIENT="$(sed -n 's/^Public key: //p' "$RUNNER_TEMP/age-pub.txt")"
          export OPENFINANCE_BACKUP_IDENTITY="$RUNNER_TEMP/age-key.txt"
          make backup
          dump="$(ls backups/openfinance-*.dump.age)"
          [ "$(stat -c %a "$dump")" = "600" ]
          ! head -c 5 "$dump" | grep -q PGDMP
          docker compose down -v
          docker compose up -d --wait
          make restore FILE="$dump" YES=1
          code="$(curl -s -o /dev/null -w '%{http_code}' -b cookies-before.txt "$BASE_URL/api/v1/me")"
          [ "$code" = "401" ] || { echo "La sesión anterior sigue valiendo ($code)" >&2; exit 1; }
          deploy/scripts/ci/balances.sh "$BASE_URL" after.json cookies-after.txt
          diff before.json after.json

      - name: Sin secretos en los logs
        run: deploy/scripts/ci/assert-no-secrets.sh cookies-*.txt

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: compose-e2e-${{ matrix.mode }}
          path: |
            compose-logs.txt
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/.auth/
          if-no-files-found: ignore
          retention-days: 7

      - name: Parar y borrar volúmenes
        if: always()
        run: docker compose down -v
