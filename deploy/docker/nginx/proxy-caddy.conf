# Modo caddy: nginx no publica puertos y solo le llega tráfico desde Caddy, que sobrescribe
# X-Forwarded-For y X-Forwarded-Proto con la IP real del cliente y el esquema (https).
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
set $of_proto $http_x_forwarded_proto;
