name: openfinance

# Instalación doméstica. Dos modos (docs/deployment/home.md):
#   direct (por defecto): el navegador entra a nginx en ${OPENFINANCE_BIND}:${OPENFINANCE_PORT}.
#   caddy: añade compose.https.yaml (COMPOSE_FILE=compose.yaml:compose.https.yaml en .env)
#          y todo entra por Caddy con HTTPS y dominio propio.
# Ni la base de datos ni la API publican puertos.

# Rotación de logs (OF-903): sin esto el log de cada contenedor crece sin límite en el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Endurecimiento común: nada de ganar privilegios.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-openfinance}
    <<: *hardening
    logging: *logging
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openfinance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openfinance}
      OPENFINANCE_ENVIRONMENT: ${OPENFINANCE_ENVIRONMENT:-production}
      OPENFINANCE_TIMEZONE: ${OPENFINANCE_TIMEZONE:-Europe/Madrid}
      OPENFINANCE_LOG_LEVEL: ${OPENFINANCE_LOG_LEVEL:-INFO}
      # Web y API comparten origen detrás de nginx: no hace falta CORS.
      OPENFINANCE_CORS_ORIGINS: "[]"
      # Secure por defecto; pon false solo si entras por http dentro de casa (modo direct).
      OPENFINANCE_SESSION_COOKIE_SECURE: ${OPENFINANCE_SESSION_COOKIE_SECURE:-true}
      OPENFINANCE_SESSION_TTL_DAYS: ${OPENFINANCE_SESSION_TTL_DAYS:-30}
      # Avisar de versiones nuevas consultando GitHub una vez al día (OF-907). Apagado por defecto.
      OPENFINANCE_UPDATE_CHECK: ${OPENFINANCE_UPDATE_CHECK:-false}
      OPENFINANCE_ATTACHMENTS_DIR: /data/attachments
    <<: *hardening
    logging: *logging
    # Corre como usuario sin privilegios (10001) y no escribe en su sistema de ficheros.
    read_only: true
    cap_drop: [ALL]
    pids_limit: 200
    tmpfs:
      - /tmp
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      # Fijo: solo compose.https.yaml lo cambia a caddy (con nginx sin puertos publicados).
      OPENFINANCE_PROXY_MODE: direct
    <<: *hardening
    logging: *logging
    # nginx arranca como root para abrir el puerto 80 y pasa a un usuario sin privilegios:
    # solo conserva las capacidades que necesita para ello.
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    pids_limit: 200
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      - /etc/nginx/conf.d
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    ports:
      - "${OPENFINANCE_BIND:-127.0.0.1}:${OPENFINANCE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  data:
    internal: true
  app: {}

volumes:
  db-data:
  attachments:
